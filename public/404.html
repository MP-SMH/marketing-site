<!doctype html>
<html lang="da" style="background:#080E1A;margin:0;padding:0;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080E1A">
  <meta name="robots" content="noindex, nofollow">
  <title>Siden findes ikke | StøtMedHjerte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #E0193F; --red-light: #FCA5B5;
      --base: #080E1A; --surface-card: #101B2D;
      --hairline: rgba(255,255,255,0.08);
      --text: #F8FAFC; --text-2: rgba(248,250,252,0.78); --text-3: rgba(248,250,252,0.50);
      --display: 'Inter Tight', 'Inter', sans-serif;
      --body: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    html, body { background: var(--base); color: var(--text); font-family: var(--body); line-height: 1.7; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; min-height: 100vh; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 120px 24px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
    .code { font-family: var(--display); font-weight: 700; font-size: 72px; letter-spacing: -0.03em; line-height: 1; color: var(--red); margin-bottom: 8px; }
    h1 { font-family: var(--display); font-weight: 700; font-size: clamp(24px, 4vw, 32px); letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 16px; }
    p { font-size: 16px; color: var(--text-2); margin-bottom: 28px; max-width: 440px; }
    .cta { display: inline-flex; align-items: center; gap: 8px; background: var(--red); color: #FFFFFF; font-weight: 600; font-size: 15px; text-decoration: none; padding: 13px 22px; border-radius: 10px; width: fit-content; }
    .cta:hover { background: #C81435; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Siden findes ikke</h1>
    <p>Du er landet på et gammelt eller forkert link. StøtMedHjerte hjælper danske foreninger med at samle støtte ind, hvor bidrag går direkte til foreningen.</p>
    <a class="cta" href="/">Gå til forsiden</a>
  </div>
</body>
</html>

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/"
  to = "/venteliste.html"
  status = 200
  force = true

[[redirects]]
  from = "/privatlivspolitik"
  to = "/privatlivspolitik.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

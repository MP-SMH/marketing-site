[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/venteliste.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/privatlivspolitik.html"
  to = "/privatlivspolitik"
  status = 301
  force = true

[[redirects]]
  from = "/collections/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/products/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/pages/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/cdn/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/"
  to = "/venteliste.html"
  status = 200
  force = true

[[redirects]]
  from = "/privatlivspolitik"
  to = "/privatlivspolitik.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "22"

# Only Deploy Previews use the staging public-profile read path.
[context.deploy-preview]
  command = "npm test -- src/pages/ForeningPage.test.jsx src/lib/staging-public-profile-preview.test.js && VITE_SMH_API_URL=https://preview-api.invalid VITE_SUPABASE_URL=https://preview-auth.invalid VITE_SUPABASE_ANON_KEY=preview-read-only VITE_SMH_PUBLIC_PROFILE_PROXY=true npm run build && node scripts/prepare-staging-profile-preview.mjs"
